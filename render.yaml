services:
  # BACKEND
  - type: web
    name: lab08-jwt-backend
    runtime: node
    rootDir: backend
    buildCommand: "apt-get update && apt-get install -y python3 make g++ && npm install && npm rebuild sqlite3 --build-from-source"
    startCommand: "npm start"
    envVars:
      - key: DB_DIALECT
        value: sqlite
      - key: SQLITE_STORAGE
        value: ./database.sqlite
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"

  # FRONTEND
  - type: web
    name: lab08-jwt-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./build
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          name: lab08-jwt-backend
          type: web
          property: hostport